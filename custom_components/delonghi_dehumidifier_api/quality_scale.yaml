# Maintainer assessment for this HACS component. Home Assistant displays the Custom tier.
# Documentation rules refer to the README. Official review also requires Core inclusion.
# https://contributors.home-assistant.io/core/quality-scale/rules/
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration registers no custom actions. It implements standard entity actions.
  appropriate-polling: done  # One-minute polling, shared requests and a coalesced refresh after writes.
  brands: done  # Bundled brand/ images and the matching custom_integrations directory in home-assistant/brands.
  common-modules: done  # Shared entity behavior is in entity.py.
  config-flow-test-coverage: done  # Coverage CI and the config flow recovery tests.
  config-flow: done  # Setup and reconfiguration validate the account and selected device.
  dependency-transparency:
    status: todo
    comment: The manifest has no standalone protocol dependency. For Core, publish the client as a licensed, tagged PyPI source distribution through public CI.
  docs-actions:
    status: exempt
    comment: There are no integration-specific actions. The README demonstrates standard humidifier actions.
  docs-conditions:
    status: exempt
    comment: The integration supplies no custom automation conditions.
  docs-high-level-description: done  # README introduction.
  docs-installation-instructions: done  # README Installation and Configuring.
  docs-removal-instructions: done  # README Removing the integration covers HACS and manual removal.
  docs-triggers:
    status: exempt
    comment: The integration supplies no custom automation triggers.
  entity-event-setup: done  # entity.py subscribes on add and registers removal callbacks.
  entity-unique-id: done  # Stable device-scoped IDs and registry upgrade tests.
  has-entity-name: done  # The primary humidifier inherits its device name. Secondary entities use translated names.
  runtime-data: done  # The typed config entry owns the API client. Ownership coordination spans entries.
  test-before-configure: done  # config_flow.py checks access to the selected device before creating an entry.
  test-before-setup: done  # Setup checks credentials, ownership and the property snapshot before forwarding.
  unique-config-entry: done  # Device-scoped unique ID, concurrent enrollment guards and persistent ownership.

  # Silver
  action-exceptions: done  # Service tests cover invalid input, rejected commands and uncertain outcomes.
  config-entry-unloading: done  # Unload stops requests, listeners and queued refreshes. Partial cleanup fences writes.
  docs-configuration-parameters: done  # README Configuring covers account changes and the fixed device binding.
  docs-installation-parameters: done  # The setup table explains language, credentials and device selection.
  entity-unavailable: done  # Polling tests cover outages, recovery and unknown readings.
  integration-owner: done  # manifest.json identifies the maintainer and issue tracker.
  log-when-unavailable: done  # The shared property request reports each outage and recovery once per device.
  parallel-updates: done  # All platforms declare a limit. The client coalesces reads and coordinates writes.
  reauthentication-flow: done  # Both setup and runtime rejection prompt for the bound account password.
  test-coverage: done  # CI checks the unrounded statement count for every integration module.

  # Gold
  devices: done  # Every platform uses the bound appliance’s device registry identity.
  diagnostics: done  # diagnostics.py exports allowlisted cached data. Tests cover redaction and offline access.
  discovery-update-info:
    status: exempt
    comment: There is no discoverable address to update. The integration uses fixed cloud endpoints.
  discovery:
    status: exempt
    comment: This cloud API lists appliances only after account authentication. No supported local discovery method is known.
  docs-data-update: done  # README describes polling, delayed post-action refresh and cloud delays.
  docs-examples: done  # Two automations use supported entity actions and states.
  docs-known-limitations: done  # README Limitations and Supported entities explain cloud and firmware constraints.
  docs-supported-devices: done  # The tested Tasciugo model is identified by name and model number.
  docs-supported-functions: done  # The entity table and mode descriptions cover controls and readings.
  docs-troubleshooting: done  # README covers setup, reauth, ownership, alarms, diagnostics and logging.
  docs-use-cases: done  # Humidity control and appliance alarm notifications are documented.
  dynamic-devices:
    status: exempt
    comment: Each entry represents exactly one selected appliance. Users add a separate entry for another device.
  entity-category: done  # Primary controls and readings are separated from configuration and diagnostics.
  entity-device-class: done  # Platforms assign appropriate humidity, temperature, duration, alarm and appliance classes.
  entity-disabled-by-default: done  # New raw mode and speed sensors start disabled. Existing registry preferences survive.
  entity-translations: done  # Secondary entity names use translation keys with English and German resources.
  exception-translations: done  # User-facing action and entry exceptions use translation keys and safe placeholders.
  icon-translations:
    status: exempt
    comment: The platforms and device classes provide the icons. The integration has no icon overrides.
  reconfiguration-flow: done  # Reconfigure verifies account access to the same bound appliance.
  repair-issues: done  # Fixable issues guide the user through missing or conflicting device bindings.
  stale-devices:
    status: exempt
    comment: Each entry represents one appliance. Removing its entry removes the device from this integration.

  # Platinum
  async-dependency: done  # The bundled cloud client uses asyncio and aiohttp for network I/O.
  inject-websession: done  # Setup, configuration flows and repairs inject the Home Assistant session.
  strict-typing:
    status: todo
    comment: All component modules are checked by strict mypy. Core registration and a typed published protocol distribution remain upstream prerequisites.
