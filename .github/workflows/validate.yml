name: Repository validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    steps:
        - uses: "actions/checkout@v4"

        - name: HACS validation
          uses: "hacs/action@main"
          with:
            category: "integration"
            ignore: brands

        - name: Hassfest validation
          uses: "home-assistant/actions/hassfest@master"

  style:
    runs-on: "ubuntu-latest"
    name: Check style formatting
    steps:
        - uses: "actions/checkout@v4"
        - uses: "actions/setup-python@v5"
          with:
            python-version: "3.14.8"
        - run: python -m pip install black==26.10.1 ruff==0.17.1
        - run: black --check .
        - run: ruff check .

  tests:
    runs-on: "ubuntu-latest"
    name: Test Home Assistant ${{ matrix.homeassistant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13.16"
            homeassistant: "2025.2.4"
            frontend: "20250214.0"
            test_plugin: "0.13.214"
          - python: "3.14.8"
            homeassistant: "2026.10.2"
            frontend: "20260930.4"
            test_plugin: "0.13.373"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: ${{ matrix.python }}
      - name: Install matched test dependencies
        run: >-
          python -m pip install -r requirements-test.txt
          "homeassistant==${{ matrix.homeassistant }}"
          "home-assistant-frontend==${{ matrix.frontend }}"
          "pytest-homeassistant-custom-component==${{ matrix.test_plugin }}"
      - name: Run tests
        run: python -m pytest -q
